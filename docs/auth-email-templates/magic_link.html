<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1B2E24">
  <img src="https://sirotech.co.ke/email/logo.png" width="150" alt="SiroTech" style="margin:24px 0" />
  <h2 style="margin:0 0 12px">Sign in to SiroTech</h2>
  <p style="margin:28px 0"><a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
     style="background:#0D9463;color:#ffffff;padding:14px 26px;border-radius:999px;text-decoration:none;display:inline-block;font-weight:600">Sign in</a></p>
  <p style="color:#5f645c">Or enter this code on the sign-in page: <strong style="letter-spacing:2px">{{ .Token }}</strong></p>
  <p style="color:#8d928a;font-size:13px;line-height:1.5">If you didn't ask for this, ignore this email. Nobody can sign in without access to your inbox.</p>
</div>
