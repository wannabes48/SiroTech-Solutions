<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1B2E24">
  <img src="https://sirotech.co.ke/email/logo.png" width="150" alt="SiroTech" style="margin:24px 0" />
  <h2 style="margin:0 0 12px">Confirm your email</h2>
  <p style="color:#5f645c;line-height:1.6">Confirm this address to open your SiroTech client portal.</p>
  <p style="margin:28px 0"><a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/welcome"
     style="background:#0D9463;color:#ffffff;padding:14px 26px;border-radius:999px;text-decoration:none;display:inline-block;font-weight:600">Confirm email</a></p>
  <p style="color:#5f645c">Or enter this code on the confirmation page: <strong style="letter-spacing:2px">{{ .Token }}</strong></p>
  <p style="color:#8d928a;font-size:13px;line-height:1.5">If you didn't create a SiroTech account, ignore this email.</p>
</div>
